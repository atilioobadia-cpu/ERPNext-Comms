[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext_comms"
version = "0.0.1"
description = "Unified Communication Hub for ERPNext — WhatsApp, SMS, Voice, Chat, AI"
authors = [{name = "Alpha Associates (T) Limited", email = "info@alphaassociates.co.tz"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "frappe>=14.0.0",
    "erpnext>=14.0.0",
    "twilio>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["erpnext_comms*"]
